services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: wikibricks-postgres
    environment:
      POSTGRES_DB: wikibricks
      POSTGRES_USER: wikibricks_user
      POSTGRES_PASSWORD: wikibricks_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./dummy.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    networks:
      - wikibricks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U wikibricks_user -d wikibricks"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application
  app:
    build: .
    container_name: wikibricks-app
    environment:
      - NODE_ENV=development
      - DB_CONN=postgresql://wikibricks_user:wikibricks_password@postgres:5432/wikibricks
    ports:
      - "3000:3000"
    volumes:
      # Mount source code for development (hot reload)
      - ./src:/app/src:ro
      - ./public:/app/public
      - ./global.css:/app/global.css:ro
      - ./tsconfig.json:/app/tsconfig.json:ro
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - wikibricks-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data:
    driver: local

networks:
  wikibricks-network:
    driver: bridge
