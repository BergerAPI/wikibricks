services:
  # PostgreSQL Database (Production)
  postgres:
    image: postgres:15-alpine
    container_name: wikibricks-postgres-prod
    environment:
      POSTGRES_DB: wikibricks
      POSTGRES_USER: ${POSTGRES_USER:-wikibricks_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_this_password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
    networks:
      - wikibricks-network
    restart: always
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-wikibricks_user} -d wikibricks",
        ]
      interval: 10s
      timeout: 5s
      retries: 5

  # Main Application (Production)
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
      args:
        COMMIT_ID: ${COMMIT_ID:-unknown}
    env_file:
      - .env
    environment:
      - NODE_ENV=production
      - DB_CONN=postgresql://${POSTGRES_USER:?set POSTGRES_USER}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD}@postgres:5432/wikibricks
      - UPLOAD_DIR=/app/data
      - ASSET_STORE_DIR=/app/shared-assets/files
      - JWT_SECRET=${JWT_SECRET:?set JWT_SECRET}
      - GITHUB_URL=${GITHUB_URL:-https://github.com/BergerAPI/wikibricks}
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - app_data_prod:/app/data
      - app_assets_prod:/app/shared-assets
    networks:
      - wikibricks-network
    restart: always
    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://localhost:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data_prod:
    driver: local
  app_data_prod:
    driver: local
  app_assets_prod:
    driver: local

networks:
  wikibricks-network:
    driver: bridge
